name: SG Client 096 Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.0.96'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore v2rayN/v2rayN.sln

      - name: Unit tests
        run: dotnet test v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=service-lib-tests.trx"

      - name: Publish Windows x64
        run: dotnet publish v2rayN/v2rayN/v2rayN.csproj -c Release -r win-x64 -p:SelfContained=true -p:EnableWindowsTargeting=true -o artifacts/sg-client

      - name: Verify executable
        shell: cmd
        run: if not exist "artifacts\sg-client\SG-Client.exe" exit /b 1

      - name: Upload source-build artifact
        uses: actions/upload-artifact@v5
        with:
          name: SG-CLIENT-096-WINDOWS-x64-SOURCE-BUILD
          path: artifacts/sg-client
          if-no-files-found: error
