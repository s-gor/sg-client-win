name: Temporary 099F source sync

on:
  push:
    branches:
      - release/099f-publication
    paths:
      - 'release-sync/READY'

permissions:
  contents: write

jobs:
  apply-overlay:
    if: github.event.head_commit.message == 'chore: stage 099F source overlay'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v6
        with:
          ref: release/099f-publication
          fetch-depth: 0

      - name: Reassemble and verify overlay
        shell: bash
        run: |
          set -euo pipefail
          cat release-sync/part*.b64 > /tmp/sg-099f-overlay.b64
          base64 --decode /tmp/sg-099f-overlay.b64 > /tmp/sg-099f-overlay.tar.gz
          echo "ffe024ca233f30185b6dffa1e81865c064c357ab13710f12b1d83fabd91fd594  /tmp/sg-099f-overlay.tar.gz" | sha256sum -c -

      - name: Apply exact 099F source overlay
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/sg-099f-overlay.tar.gz -C .
          rm -rf release-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Overlay produced no source changes" >&2
            exit 1
          fi
          git commit -m "feat: sync SG Client 099F source"
          git push origin HEAD:release/099f-publication
