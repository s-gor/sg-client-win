name: SG Client 102 SG-Net source package

on:
  push:
    branches: [feature/sgnet-101-recovery-20261012]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-zip:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore v2rayN/v2rayN.sln
      - name: Unit tests
        run: dotnet test v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --no-restore
      - name: Compile portable client
        run: dotnet publish v2rayN/v2rayN/v2rayN.csproj -c Release -r win-x64 -p:SelfContained=true -p:EnableWindowsTargeting=true -o build-check
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path build-check/SG-Client.exe)) { throw 'SG-Client.exe missing' }
      - name: Package complete sources
        shell: pwsh
        run: |
          $short = '${{ github.sha }}'.Substring(0,12)
          $name = "SG-CLIENT-102-SGNET-READY-TO-BUILD-$short.zip"
          git archive --format=zip --output=$name HEAD
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $name)) { throw 'Source ZIP creation failed' }
          "SOURCE_ZIP=$name" >> $env:GITHUB_ENV
          "RELEASE_TAG=sg-client-102-sgnet-$short" >> $env:GITHUB_ENV
          Get-FileHash $name -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $name" } | Set-Content SHA256SUMS
      - name: Publish source archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" "$env:SOURCE_ZIP" SHA256SUMS --title "SG Client 102 - SG-Net integration test source" --notes "Experimental source ZIP, built and unit-tested in CI. SG-Net runtime binary not bundled. TUN and HTTP system proxy integration unverified."
