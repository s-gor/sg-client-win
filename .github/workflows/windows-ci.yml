name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-099f-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v6
        with:
          ref: release/099f-publication
          fetch-depth: 0

      - name: Apply exact 099F patch when staged
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f release-sync/READY ]; then
            echo "099F patch already applied; nothing to sync."
            exit 0
          fi
          cat release-sync/part*.b64 > /tmp/sg-096-to-099f.patch.xz.b64
          base64 --decode /tmp/sg-096-to-099f.patch.xz.b64 > /tmp/sg-096-to-099f.patch.xz
          echo "168dfeaff9900f73e3e5c3f2975b4628352b42a854b71fef44a985cffab3a121  /tmp/sg-096-to-099f.patch.xz" | sha256sum -c -
          xz -dc /tmp/sg-096-to-099f.patch.xz > /tmp/sg-096-to-099f.patch
          echo "bf3cc9f771f85a659d7a979b7c7c823925223dbafbd47e6b9c5739b275303e2a  /tmp/sg-096-to-099f.patch" | sha256sum -c -
          git checkout origin/main -- v2rayN
          git apply --index --whitespace=nowarn /tmp/sg-096-to-099f.patch
          rm -rf release-sync
          rm -f .github/workflows/sync-099f-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: sync exact SG Client 099F source"
          git push origin HEAD:release/099f-publication

  build-test:
    needs: sync-099f-source
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore v2rayN/v2rayN.sln

      - name: Unit tests
        run: dotnet test v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=service-lib-tests.trx"

      - name: Publish SG Client
        run: dotnet publish v2rayN/v2rayN/v2rayN.csproj -c Release -r win-x64 -p:SelfContained=true -p:EnableWindowsTargeting=true -o artifacts/sg-client

      - name: Verify output
        shell: cmd
        run: |
          if not exist "artifacts\sg-client\SG-Client.exe" exit /b 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: sg-client-099f-source-build
          path: artifacts/sg-client
          if-no-files-found: error
